name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build frontend (needed by tauri-build)
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Frontend checks (typecheck, lint, format, test, bindings drift)
        run: npm run check

      - name: Performance budgets (load, reduction, memory)
        run: cargo test -p plot-twist-core --release --test perf -- --ignored --nocapture

      - name: Startup budget
        shell: pwsh
        run: ./scripts/check-startup.ps1
